[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy", "pandas", "scipy", "xarray", "dask", "zarr>=3",
    "rioxarray", "rasterio", "matplotlib", "sentinelhub", "cdsapi",
]

[project.optional-dependencies]
# CUDA build: pip install -e ".[dl]" --extra-index-url https://download.pytorch.org/whl/cu130
dl = ["torch==2.14.1", "torchvision==0.29.1"]


[tool.setuptools]
packages = ["src"]
