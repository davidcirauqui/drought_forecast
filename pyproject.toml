[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drought-forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy", "pandas", "scipy", "xarray", "dask", "zarr>=3",
    "rioxarray", "rasterio", "matplotlib", "sentinelhub", "cdsapi",
]

[tool.setuptools]
packages = ["src"]
